name: student
description: "Seon Topik Student"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

  supabase_flutter: ^2.18.3
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  intl: ^0.20.3
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  shared_preferences: ^2.5.6
  flutter_localizations:
    sdk: flutter
  package_info_plus: ^10.2.2
  cupertino_ui: ^1.1.7
  image_picker: ^1.2.4
  cached_network_image: ^4.0.7
  qr_flutter: ^4.1.0
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.8
  screen_brightness: ^2.1.12
  just_audio: ^0.10.6
  http: ^1.6.0
  file_picker: ^13.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/

  # Inter on Android; iPhone uses its own SF Pro. Hangul comes from the phone's fonts.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# The app's icon, from the centre's logo: `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21

# The screen shown while the app starts, light and dark:
# `dart run flutter_native_splash:create`.
flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/icon/splash.png"
  color_dark: "#0B0B14"
  image_dark: "assets/icon/splash.png"
  android_12:
    color: "#FFFFFF"
    image: "assets/icon/splash_android12.png"
    color_dark: "#0B0B14"
    image_dark: "assets/icon/splash_android12.png"
  ios: true
  android: true
  web: false
